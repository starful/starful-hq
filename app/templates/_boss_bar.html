{# 사장 로그인 상태 (header). Needs: boss, boss_off_ask (app context). #}
{% if boss.me %}
<span class="boss-bar on{% if boss_off_ask %} off-hours{% endif %}" title="{% if boss_off_ask %}{{ boss_off_ask }}{% else %}사장 계정으로 들어와 있어요 · 사원들은 자리에 앉아 있어요{% endif %}">
    👑 <b>{{ boss.name }}</b> 사장님
    {% if boss_off_ask %}<span class="boss-off-ask">{{ boss_off_ask }}</span>{% endif %}
    <a href="{{ url_for('logout', next=request.path) }}">퇴근(로그아웃)</a>
</span>
{% else %}
<a class="boss-bar" href="{{ url_for('login', next=request.path) }}" title="이 Mac에서 사장으로 들어와요 (구글 OAuth는 /login?oauth=1)">👑 사장 로그인</a>
{% endif %}
